<!DOCTYPE html>
<html>
<head>
    <title>Sentence-BERT NLI Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 w-75">

        <h3 class="text-center mb-4">Sentence-BERT NLI Prediction</h3>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Premise</label>
                <textarea class="form-control" name="premise" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Hypothesis</label>
                <textarea class="form-control" name="hypothesis" required></textarea>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-primary">Predict</button>
            </div>
        </form>

        {% if prediction %}
        <div class="alert alert-info text-center mt-4">
            <strong>Prediction:</strong> {{ prediction }}
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
